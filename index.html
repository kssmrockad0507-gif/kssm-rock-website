<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSSM Rock Redeem</title>

<style>
body{
  margin:0;
  background:#020617;
  color:#fff;
  font-family:system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.card{
  width:100%;
  max-width:380px;
  padding:24px;
  border-radius:14px;
  border:1px solid #1e293b;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:12px;
}
button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  background:#475569;
}
#result{margin-top:16px}
footer{
  margin-top:18px;
  font-size:12px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="card">
  <h2>KSSM ROCK</h2>
  <p style="color:#94a3b8">Free Redeem Code</p>

  <input id="instaId" placeholder="Instagram ID">
  <button id="btn">Create Code</button>
  <div id="result"></div>

  <footer>DM us on Instagram</footer>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

emailjs.init("kvfG3cmsf5ZZnSUil");

const firebaseConfig = {
  apiKey: "AIzaSyAUC-4VsvroAT_D6Yy5qUV7uyXSbpCZs7M",
  authDomain: "kssm-rock-redeem.firebaseapp.com",
  projectId: "kssm-rock-redeem",
  storageBucket: "kssm-rock-redeem.appspot.com",
  messagingSenderId: "750982235590",
  appId: "1:750982235590:web:5338b3c4178d67f2da9ec7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const btn = document.getElementById("btn");
const result = document.getElementById("result");

function generateCode(){
  const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let r="KSSM-";
  for(let i=0;i<6;i++) r+=c[Math.floor(Math.random()*c.length)];
  return r;
}

btn.onclick = async ()=>{
  const insta = instaId.value.trim();
  if(!insta){
    result.textContent="Instagram ID கொடுக்கவும்";
    return;
  }

  btn.disabled=true;
  result.textContent="Please wait...";

  try{
    const counterRef = doc(db,"settings","counter");
    const counterSnap = await getDoc(counterRef);
    const { total_users, max_limit } = counterSnap.data();

    const userRef = doc(db,"users",insta);
    const userSnap = await getDoc(userRef);

    // 🔒 EXISTING USER → NO EMAIL
    if(userSnap.exists()){
      result.innerHTML=`Your Code:<br><b>${userSnap.data().code}</b>`;
      btn.disabled=false;
      return;
    }

    if(total_users >= max_limit){
      result.textContent="Limit reached ❌";
      btn.disabled=false;
      return;
    }

    const code = generateCode();

    await setDoc(userRef,{
      code,
      created_at:new Date()
    });

    await updateDoc(counterRef,{
      total_users: total_users + 1
    });

    // 📧 EMAIL ONLY ONCE
    await emailjs.send(
      "service_y67yted",
      "template_b6siey4",
      {
        insta_id: insta,
        redeem_code: code,
        date_time: new Date().toLocaleString()
      }
    );

    result.innerHTML=`Your Code:<br><b>${code}</b>`;

  }catch(e){
    console.error(e);
    result.textContent="Error occurred";
  }

  btn.disabled=false;
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSSM Rock Redeem</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #020617, #020617);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    p.sub {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1rem;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #475569;
      color: #cbd5f5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 18px;
      font-size: 0.95rem;
      word-break: break-word;
    }

    footer {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #64748b;
    }

    /* Desktop enhancement */
    @media (min-width: 768px) {
      .card {
        max-width: 420px;
        padding: 30px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>KSSM ROCK</h1>
    <p class="sub">Free Redeem Code System</p>

    <input type="text" id="instaId" placeholder="Instagram ID">

    <button id="createBtn">Create Code</button>

    <div id="result"></div>

    <footer>
      Copy the code and DM us on Instagram
    </footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUC-4VsvroAT_D6Yy5qUV7uyXSbpCZs7M",
      authDomain: "kssm-rock-redeem.firebaseapp.com",
      projectId: "kssm-rock-redeem",
      storageBucket: "kssm-rock-redeem.firebasestorage.app",
      messagingSenderId: "750982235590",
      appId: "1:750982235590:web:5338b3c4178d67f2da9ec7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btn = document.getElementById("createBtn");
    const result = document.getElementById("result");

    function generateCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "KSSM-";
      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    btn.addEventListener("click", async () => {
      const instaId = document.getElementById("instaId").value.trim();

      if (!instaId) {
        result.textContent = "Instagram ID கொடுக்கவும்";
        return;
      }

      btn.disabled = true;
      result.textContent = "Please wait...";

      try {
        const counterRef = doc(db, "settings", "counter");
        const counterSnap = await getDoc(counterRef);

        if (!counterSnap.exists()) {
          result.textContent = "System not ready";
          btn.disabled = false;
          return;
        }

        const { total_users, max_limit } = counterSnap.data();

        if (total_users >= max_limit) {
          result.textContent = "Limit reached ❌";
          btn.disabled = false;
          return;
        }

        const userRef = doc(db, "users", instaId);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          result.innerHTML = `Your code:<br><b>${userSnap.data().code}</b>`;
        } else {
          const newCode = generateCode();

          await setDoc(userRef, {
            code: newCode,
            redeemed: false,
            created_at: new Date()
          });

          await updateDoc(counterRef, {
            total_users: total_users + 1
          });

          result.innerHTML = `Your code:<br><b>${newCode}</b>`;
        }
      } catch (err) {
        result.textContent = "Error occurred";
        console.error(err);
      }

      btn.disabled = false;
    });
  </script>

</body>
</html>

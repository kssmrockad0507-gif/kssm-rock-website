<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSSM Rock Redeem</title>

<style>
body{
  margin:0;
  background:#020617;
  color:#fff;
  font-family:system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.card{
  width:100%;
  max-width:380px;
  padding:24px;
  border-radius:14px;
  border:1px solid #1e293b;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:12px;
}
input{font-size:15px}
button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  background:#475569;
  cursor:not-allowed;
}
#result{margin-top:16px;font-size:15px}
footer{
  margin-top:18px;
  font-size:12px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="card">
  <h2>KSSM ROCK</h2>
  <p style="color:#94a3b8">Free Redeem Code</p>

  <input id="instaId" placeholder="Instagram ID">
  <button id="btn">Create Code</button>

  <div id="result"></div>

  <footer>Copy the code & DM us on Instagram</footer>
</div>

<!-- ✅ EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("kvfG3cmsf5ZZnSUil"); 
</script>

<!-- ✅ Firebase + Logic -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAUC-4VsvroAT_D6Yy5qUV7uyXSbpCZs7M",
  authDomain: "kssm-rock-redeem.firebaseapp.com",
  projectId: "kssm-rock-redeem",
  storageBucket: "kssm-rock-redeem.appspot.com",
  messagingSenderId: "750982235590",
  appId: "1:750982235590:web:5338b3c4178d67f2da9ec7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const btn = document.getElementById("btn");
const result = document.getElementById("result");
const instaInput = document.getElementById("instaId");

/* 🔐 Code Generator */
function generateCode(){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let code="KSSM-";
  for(let i=0;i<6;i++){
    code+=chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}

btn.addEventListener("click", async ()=>{
  const instaRaw = instaInput.value.trim();

  if(!instaRaw){
    result.textContent="Instagram ID கொடுக்கவும்";
    return;
  }

  // Firestore-safe ID
  const insta = instaRaw.replace(/[^a-zA-Z0-9_]/g,"_");

  btn.disabled=true;
  result.textContent="Please wait...";

  try{
    const counterRef = doc(db,"settings","counter");
    const counterSnap = await getDoc(counterRef);

    if(!counterSnap.exists()){
      result.textContent="System not ready";
      btn.disabled=false;
      return;
    }

    const { total_users, max_limit } = counterSnap.data();

    const userRef = doc(db,"users",insta);
    const userSnap = await getDoc(userRef);

    /* 🔒 EXISTING USER → NO EMAIL */
    if(userSnap.exists()){
      result.innerHTML=`Your Code:<br><b>${userSnap.data().code}</b>`;
      btn.disabled=false;
      return;
    }

    /* 🚫 LIMIT CHECK */
    if(total_users >= max_limit){
      result.textContent="Limit reached ❌";
      btn.disabled=false;
      return;
    }

    /* 🆕 NEW USER */
    const newCode = generateCode();

    await setDoc(userRef,{
      code:newCode,
      created_at:new Date()
    });

    await updateDoc(counterRef,{
      total_users: total_users + 1
    });

    /* 📧 SEND EMAIL (ONLY FIRST TIME) */
    await emailjs.send(
      "service_y67yted",
      "template_b6siey4",
      {
        insta_id: instaRaw,
        redeem_code: newCode,
        date_time: new Date().toLocaleString()
      }
    );

    result.innerHTML=`Your Code:<br><b>${newCode}</b>`;

  }catch(err){
    console.error(err);
    result.textContent="Error occurred";
  }

  btn.disabled=false;
});
</script>

</body>
</html>
